<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Linear irregular waves from a JONSWAP spectrum: surface, wave-gauge record, spectrum estimate and wave-height statistics.">
  <title>线性不规则波 · 卿景博</title>
  <link rel="stylesheet" href="../common/katex/katex.min.css">
  <link rel="stylesheet" href="../common/demo.css">
  <script src="../common/katex/katex.min.js"></script>
</head>
<body>
  <main>
    <header class="top">
      <div>
        <a class="back" href="../../zh/updates/wave-lab/" data-back data-i18n="back">← 返回卿景博的学术主页</a>
        <p class="eyebrow" data-i18n="eyebrow">线性波 · 不规则波</p>
        <h1 data-i18n="title">线性不规则波</h1>
        <p class="intro" data-i18n="intro">由 JONSWAP 谱生成随机波面：许多频率不同、相位随机的规则波叠加，各自按色散关系传播。</p>
      </div>
      <nav class="languages" aria-label="Language"><a href="?lang=zh" data-language="zh">中文</a><a href="?lang=en" data-language="en">English</a></nav>
    </header>

    <section class="controls" data-i18n-label="parameters">
      <div><label for="hs"><span><span data-i18n="hs">有效波高</span> <span data-tex="H_s"></span></span><output id="hs-output" for="hs"></output></label><input id="hs" type="range"></div>
      <div><label for="tp"><span><span data-i18n="tp">谱峰周期</span> <span data-tex="T_p"></span></span><output id="tp-output" for="tp"></output></label><input id="tp" type="range" min="0.6" max="18" step="0.05" value="1.2"></div>
      <div><label for="gamma"><span><span data-i18n="gamma">谱峰升高因子</span> <span data-tex="\gamma"></span></span><output id="gamma-output" for="gamma"></output></label><input id="gamma" type="range" min="1" max="7" step="0.1" value="3.3"></div>
      <div><label for="depth"><span><span data-i18n="depth">水深</span> <span data-tex="h"></span></span><output id="depth-output" for="depth"></output></label><input id="depth" type="range"></div>
    </section>
    <div class="toolbar">
      <button type="button" id="preset-flume" data-i18n="presetFlume">水槽试验工况</button>
      <button type="button" id="preset-sea" data-i18n="presetSea">典型海况</button>
      <span class="spacer"></span>
      <button type="button" id="reseed" data-i18n="reseed">换一组随机相位</button>
      <button type="button" id="play"></button>
    </div>

    <div class="panel">
      <div class="panel-head"><h2 data-i18n="surfaceTitle">某一时刻的水面</h2><span class="panel-note" data-i18n="surfaceNote">各图坐标范围按整数分档，只在必要时换档</span></div>
      <svg id="surface" role="img" data-i18n-label="surfaceTitle"></svg>
    </div>
    <div class="panel">
      <div class="panel-head"><h2 data-i18n="gaugeTitle">浪高仪记录</h2><span class="panel-note" data-i18n="gaugeNote">上图竖线处的波面时程，右端为当前时刻</span></div>
      <svg id="gauge" role="img" data-i18n-label="gaugeTitle"></svg>
    </div>
    <div class="panels">
      <div class="panel">
        <div class="panel-head"><h2 data-i18n="spectrumTitle">波浪谱</h2></div>
        <div class="legend"><span class="theory" data-i18n="theory">输入的 JONSWAP 谱</span><span class="estimate" data-i18n="estimate">由长记录估计（Welch 法）</span></div>
        <svg id="spectrum" role="img" data-i18n-label="spectrumTitle"></svg>
      </div>
      <div class="panel">
        <div class="panel-head"><h2 data-i18n="heightTitle">波高分布</h2></div>
        <div class="legend"><span class="bars" data-i18n="bars">长记录中的跨零波高</span><span class="theory" data-i18n="rayleigh">Rayleigh 分布</span></div>
        <svg id="heights" role="img" data-i18n-label="heightTitle"></svg>
      </div>
    </div>

    <dl class="metrics" aria-live="polite">
      <div><dt><span data-i18n="mLp">谱峰波长</span> <span data-tex="L_p"></span></dt><dd><span id="m-Lp"></span><small>m</small></dd></div>
      <div><dt><span data-i18n="mDepth">相对水深</span> <span data-tex="h/L_p"></span></dt><dd><span id="m-hL"></span><span class="sub" id="m-class"></span></dd></div>
      <div><dt><span data-i18n="mSteep">有效波陡</span> <span data-tex="H_s/L_p"></span></dt><dd><span id="m-steep"></span></dd></div>
      <div><dt><span data-i18n="mH13">记录中的有效波高</span> <span data-tex="H_{1/3}"></span></dt><dd><span id="m-H13"></span><small>m</small><span class="sub" id="m-H13-ref"></span></dd></div>
      <div><dt><span data-i18n="mHmax">记录中的最大波高</span> <span data-tex="H_{\max}"></span></dt><dd><span id="m-Hmax"></span><small>m</small><span class="sub" id="m-Hmax-ref"></span></dd></div>
      <div><dt><span data-i18n="mTz">平均跨零周期</span> <span data-tex="T_z"></span></dt><dd><span id="m-Tz"></span><small>s</small><span class="sub" id="m-Tz-ref"></span></dd></div>
    </dl>
    <div class="equations">
      <div class="row"><span data-i18n="eqSurface">波面</span><span class="tex" data-tex="\eta(x,t) = \sum_j a_j\cos(k_j x - \omega_j t + \varphi_j),\qquad a_j = \sqrt{2S(f_j)\,\Delta f}"></span></div>
      <div class="row"><span data-i18n="eqDisp">色散关系</span><span class="tex" data-tex="\omega_j^2 = g k_j \tanh(k_j h)"></span></div>
      <div class="row"><span data-i18n="eqSpec">JONSWAP 谱</span><span class="tex" data-tex="S(f) \propto f^{-5}\exp\!\left[-\tfrac{5}{4}\left(\tfrac{f_p}{f}\right)^{4}\right]\gamma^{\,r},\quad r = \exp\!\left[-\dfrac{(f-f_p)^2}{2\sigma_J^2 f_p^2}\right],\quad \sigma_J = \begin{cases}0.07 & f \le f_p\\ 0.09 & f > f_p\end{cases}"></span></div>
      <div class="row"><span data-i18n="eqStats">谱矩与波高</span><span class="tex" data-tex="m_n = \int_0^{\infty} f^{\,n} S(f)\,df,\qquad H_{m0} = 4\sqrt{m_0},\qquad T_{m02} = \sqrt{m_0/m_2}"></span></div>
      <div class="row"><span data-i18n="eqRayleigh">Rayleigh 分布</span><span class="tex" data-tex="p(x) = 4x\,e^{-2x^2},\qquad x = H/H_{m0}"></span></div>
    </div>
    <p class="note"><span class="validity" id="validity"></span><span id="record-note"></span></p>
    <noscript><p class="note">此演示需要启用 JavaScript。This demonstration requires JavaScript.</p></noscript>
  </main>
  <script type="module">
    import { setupPage, slider, playback, node, text, mathText, richText, responsive, path, fmt, ticks, label, steadySpan, FINE_STEPS } from '../common/demo.js';
    import { jonswap, moment, synthesizeRecord, zeroUpCrossing, welch, highestThird, waveNumber, depthClass, random } from '../common/wave-core.js';

    const { t } = setupPage({
      zh: { back:'← 返回卿景博的学术主页', eyebrow:'线性波 · 不规则波', title:'线性不规则波', intro:'由 JONSWAP 谱生成随机波面：许多频率不同、相位随机的规则波叠加，各自按色散关系传播。', parameters:'波浪参数',
        hs:'有效波高', tp:'谱峰周期', gamma:'谱峰升高因子', depth:'水深', presetFlume:'水槽试验工况', presetSea:'典型海况', reseed:'换一组随机相位', pause:'暂停', play:'播放',
        surfaceTitle:'某一时刻的水面', surfaceNote:'各图坐标范围按整数分档，只在必要时换档', gaugeTitle:'浪高仪记录', gaugeNote:'上图竖线处的波面时程，右端为当前时刻',
        spectrumTitle:'波浪谱', theory:'输入的 JONSWAP 谱', estimate:'由长记录估计（Welch 法）', heightTitle:'波高分布', bars:'长记录中的跨零波高', rayleigh:'Rayleigh 分布',
        mLp:'谱峰波长', mDepth:'相对水深', mSteep:'有效波陡', mH13:'记录中的有效波高', mHmax:'记录中的最大波高', mTz:'平均跨零周期', eqSurface:'波面', eqDisp:'色散关系', eqSpec:'JONSWAP 谱', eqStats:'谱矩与波高', eqRayleigh:'Rayleigh 分布',  gauge:'浪高仪', timeAxis:'距当前时刻 (s)',
        deep:'深水', intermediate:'过渡水深', shallow:'浅水', fromSpec:'由谱：',
        record:(n, len) => `统计和谱估计来自同一组参数的长记录：约 ${len} 个谱峰周期、${n} 个跨零波。各频率分量独立传播，随机相位在 0 到 2π 间均匀分布。`,
        linear:'线性叠加', linearTitle:'Hs/Lp ≤ 0.04 且 Hs/h ≤ 0.4。', caution:'波陡较大', cautionTitle:'Hs/Lp > 0.04 或 Hs/h > 0.4：实际海况中非线性和破碎会比较明显。',
        flumeTitle:'实验室水槽测试中可能用到的不规则波工况：JONSWAP，γ = 3.3，Hs = 0.12 m，Tp = 1.2 s，水深 0.8 m。' },
      en: { back:'← Jingbo Qing · Academic homepage', eyebrow:'Linear waves · Irregular', title:'Linear irregular waves', intro:'A random sea from a JONSWAP spectrum: many regular waves with different frequencies and random phases, each travelling with its own dispersion relation.', parameters:'Wave parameters',
        hs:'Significant height', tp:'Peak period', gamma:'Peak enhancement', depth:'Depth', presetFlume:'Flume case', presetSea:'Typical sea state', reseed:'New random phases', pause:'Pause', play:'Play',
        surfaceTitle:'Free surface at one instant', surfaceNote:'Axis ranges in every plot change in round steps, only when needed', gaugeTitle:'Wave-gauge record', gaugeNote:'Elevation at the vertical line above; now is at the right end',
        spectrumTitle:'Wave spectrum', theory:'Input JONSWAP spectrum', estimate:'Estimated from a long record (Welch)', heightTitle:'Wave-height distribution', bars:'Zero-crossing heights in the long record', rayleigh:'Rayleigh distribution',
        mLp:'Peak wavelength', mDepth:'Relative depth', mSteep:'Significant steepness', mH13:'Significant height in record', mHmax:'Largest wave in record', mTz:'Mean zero-crossing period', eqSurface:'Free surface', eqDisp:'Dispersion', eqSpec:'JONSWAP spectrum', eqStats:'Moments and heights', eqRayleigh:'Rayleigh distribution',  gauge:'gauge', timeAxis:'time before now (s)',
        deep:'deep water', intermediate:'intermediate depth', shallow:'shallow water', fromSpec:'from spectrum: ',
        record:(n, len) => `Statistics and the spectrum estimate come from a long record with the same parameters: about ${len} peak periods and ${n} zero-crossing waves. Components travel independently; phases are uniform on 0–2π.`,
        linear:'Linear superposition', linearTitle:'Hs/Lp ≤ 0.04 and Hs/h ≤ 0.4.', caution:'Steep sea', cautionTitle:'Hs/Lp > 0.04 or Hs/h > 0.4: nonlinearity and breaking would be noticeable in a real sea.',
        flumeTitle:'An irregular-wave condition that might be used in a laboratory flume test: JONSWAP, γ = 3.3, Hs = 0.12 m, Tp = 1.2 s, depth 0.8 m.' },
    }, 'wave-lab');
    document.getElementById('preset-flume').title = t.flumeTitle;

    const schedule = (() => { let pending = false; return () => { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; compute(); }); } }; })();
    const Hs = slider('hs', { min: 0.02, max: 8, log: true, format: (v) => `${fmt(v, 3)} m`, onInput: schedule });
    const Tp = slider('tp', { min: 0.6, max: 18, format: (v) => `${v.toFixed(2)} s`, onInput: schedule });
    const Gm = slider('gamma', { min: 1, max: 7, format: (v) => v.toFixed(1), onInput: schedule });
    const Dp = slider('depth', { min: 0.2, max: 200, log: true, format: (v) => `${fmt(v, 3)} m`, onInput: schedule });
    const presets = { flume: [0.12, 1.2, 3.3, 0.8], sea: [2.5, 9, 3.3, 30] };
    const apply = ([a, b, c, d]) => { Hs.set(a); Tp.set(b); Gm.set(c); Dp.set(d); axes = {}; compute(); };
    let seed = 2026;
    // Axis ranges kept between updates (see steadySpan), so wave height and period changes show in the plots.
    let sea, axes = {};

    function compute() {
      const hs = Hs.get(), tp = Tp.get(), gamma = Gm.get(), h = Dp.get(), fp = 1 / tp;
      const S = jonswap(hs, tp, gamma);
      const record = synthesizeRecord(S, tp, seed);
      const { H, T } = zeroUpCrossing(record.eta, record.dt);
      const est = welch(record.eta, record.dt, 2048);
      const m0 = (hs * hs) / 16, m2 = moment(S, 2, 16 * fp);
      // Animation: a thinned set of the same frequency grid, so the picture repeats only after a long time.
      const peak = S(fp);
      const bins = [];
      for (let j = 1; j * record.df <= 5 * fp; j++) if (S(j * record.df) >= 1e-3 * peak) bins.push(j);
      const stride = Math.max(1, Math.ceil(bins.length / 240)); // repeats after ≥ 51 Tp, longer than the record window
      const rand = random(seed + 1);
      const comps = [];
      for (let i = 0; i < bins.length; i += stride) {
        const f = bins[i] * record.df, w = 2 * Math.PI * f;
        comps.push({ a: Math.sqrt(2 * S(f) * record.df * stride), w, k: waveNumber(w, h), ph: 2 * Math.PI * rand() });
      }
      const kp = waveNumber(2 * Math.PI * fp, h), Lp = (2 * Math.PI) / kp;
      let sPeak = S(fp);
      axes.f = steadySpan(axes.f, fp, { target: 3, min: 2.5, max: 9, mantissas: FINE_STEPS });
      est.f.forEach((f, i) => { if (f <= axes.f) sPeak = Math.max(sPeak, est.S[i]); });
      axes.x = steadySpan(axes.x, Lp, { target: 6, min: 3, max: 15 });
      axes.eta = steadySpan(axes.eta, hs, { target: 1.3, min: 1.1, max: 3.3 });
      axes.t = steadySpan(axes.t, tp, { target: 25, min: 16, max: 45, mantissas: FINE_STEPS });
      axes.S = steadySpan(axes.S, sPeak, { target: 1.25, min: 1.02, max: 4, mantissas: FINE_STEPS });
      const xg = 0.2 * axes.x, period = 1 / (record.df * stride), dtg = tp / 24;
      const gaugeEta = new Float64Array(Math.ceil(period / dtg));
      for (let i = 0; i < gaugeEta.length; i++) {
        let s = 0;
        for (const c of comps) s += c.a * Math.cos(c.k * xg - c.w * i * dtg + c.ph);
        gaugeEta[i] = s;
      }
      sea = { hs, tp, gamma, h, fp, S, est, H, Hmax: Math.max(...H), H13: highestThird(H), Tz: T.reduce((s, x) => s + x, 0) / T.length, Tm02: Math.sqrt(m0 / m2), comps, Lp, span: axes.x, eta: axes.eta, window: axes.t, fmax: axes.f, smax: axes.S, xg, period, dtg, gaugeEta, records: Math.round((record.eta.length * record.dt) / tp) };
      metrics();
      [surf, gauge, spec, hist].forEach((p) => p.redraw());
    }

    function metrics() {
      const hL = sea.h / sea.Lp;
      const set = (id, v) => richText(document.getElementById(id), v);
      set('m-Lp', fmt(sea.Lp, 3)); set('m-hL', fmt(hL, 3)); set('m-class', t[depthClass(hL)]);
      set('m-steep', fmt(sea.hs / sea.Lp, 3));
      set('m-H13', fmt(sea.H13, 3)); set('m-H13-ref', `${t.fromSpec}$H_{m0} = ${fmt(sea.hs, 3)}$ m`);
      set('m-Hmax', fmt(sea.Hmax, 3)); set('m-Hmax-ref', `$H_{\\max}/H_s = ${fmt(sea.Hmax / sea.hs, 3)}$`);
      set('m-Tz', fmt(sea.Tz, 3)); set('m-Tz-ref', `${t.fromSpec}$T_{m02} = ${fmt(sea.Tm02, 3)}$ s`);
      const steep = sea.hs / sea.Lp > 0.04 || sea.hs / sea.h > 0.4;
      const v = document.getElementById('validity');
      v.className = 'validity' + (steep ? ' caution' : '');
      v.textContent = steep ? t.caution : t.linear;
      v.title = steep ? t.cautionTitle : t.linearTitle;
      set('record-note', t.record(sea.H.length, sea.records));
    }

    const M = { left: 48, right: 14, top: 24, bottom: 40 }; // top leaves room between the axis title and the top tick
    function frame(svg, w, height, xmax, ymin, ymax, xlabel, xticks, yticks) {
      svg.querySelector('g.root')?.remove();
      const root = node('g', { class: 'root' }, svg);
      const pw = w - M.left - M.right, ph = height - M.top - M.bottom;
      const X = (x) => M.left + (x / xmax) * pw, Y = (y) => M.top + ((ymax - y) / (ymax - ymin)) * ph;
      xticks.forEach(([v, s]) => { node('line', { x1: X(v), x2: X(v), y1: M.top, y2: M.top + ph, class: 'grid' }, root); text(root, X(v), height - 21, s, { 'text-anchor': 'middle' }); });
      yticks.forEach((v) => { node('line', { x1: M.left, x2: M.left + pw, y1: Y(v), y2: Y(v), class: 'grid' }, root); text(root, M.left - 6, Y(v) + 4, label(v), { 'text-anchor': 'end' }); });
      node('line', { x1: M.left, x2: M.left + pw, y1: M.top + ph, y2: M.top + ph, class: 'axis' }, root);
      node('line', { x1: M.left, x2: M.left, y1: M.top, y2: M.top + ph, class: 'axis' }, root);
      mathText(root, M.left + pw, height - 5, xlabel, { 'text-anchor': 'end', class: 'label' });
      return { root, X, Y, pw, ph };
    }
    const etaRange = () => sea.eta;
    const etaTicks = () => [-sea.eta, 0, sea.eta];

    // Free surface at one instant.
    const surfEl = document.getElementById('surface');
    let surfLayer = {};
    const surf = responsive(surfEl, 190, (w) => {
      if (!sea) return;
      const xmax = sea.span, tk = ticks(xmax, 5);
      const f = frame(surfEl, w, 190, xmax, -etaRange(), etaRange(), '$x$ (m)', tk.values.map((v) => [v, label(v)]), etaTicks());
      surfLayer = { ...f, xmax, fill: node('path', { fill: '#e6f2ee' }, f.root), line: node('path', { fill: 'none', stroke: '#216b68', 'stroke-width': 1.8 }, f.root) };
      node('line', { x1: f.X(sea.xg), x2: f.X(sea.xg), y1: M.top, y2: M.top + f.ph, stroke: '#183846', 'stroke-dasharray': '3 3' }, f.root);
      text(f.root, f.X(sea.xg) + 5, M.top + 12, t.gauge, { class: 'label' });
      mathText(f.root, 4, M.top - 10, '$\\eta$ (m)', { class: 'label' });
      drawSurface(clock ? clock.time : 0);
    });
    function drawSurface(time) {
      if (!surfLayer.line) return;
      const { X, Y, xmax, ph } = surfLayer, n = 360, xs = [], ys = [];
      for (let i = 0; i <= n; i++) {
        const x = (i / n) * xmax;
        let s = 0;
        for (const c of sea.comps) s += c.a * Math.cos(c.k * x - c.w * time + c.ph);
        xs.push(X(x)); ys.push(Math.min(Math.max(Y(s), M.top), M.top + ph));
      }
      const line = path(xs, ys);
      surfLayer.line.setAttribute('d', line);
      surfLayer.fill.setAttribute('d', `${line}L${X(xmax)},${M.top + ph}L${X(0)},${M.top + ph}Z`);
    }

    // Wave-gauge record: the last 16–45 peak periods, in a round number of seconds.
    const gaugeEl = document.getElementById('gauge');
    let gaugeLayer = {};
    const gauge = responsive(gaugeEl, 160, (w) => {
      if (!sea) return;
      const span = sea.window, tk = ticks(span, 5);
      const f = frame(gaugeEl, w, 160, span, -etaRange(), etaRange(), t.timeAxis, tk.values.map((v) => [span - v, v ? `−${label(v)}` : '0']), etaTicks());
      gaugeLayer = { ...f, span, line: node('path', { fill: 'none', stroke: '#216b68', 'stroke-width': 1.5 }, f.root) };
      mathText(f.root, 4, M.top - 10, '$\\eta$ (m)', { class: 'label' });
      drawGauge(clock ? clock.time : 0);
    });
    function drawGauge(time) {
      if (!gaugeLayer.line) return;
      const { X, Y, span, ph } = gaugeLayer, n = sea.gaugeEta.length, xs = [], ys = [];
      const steps = Math.round(span / sea.dtg), end = Math.floor(time / sea.dtg);
      for (let i = 0; i <= steps; i++) {
        const idx = (((end - steps + i) % n) + n) % n;
        xs.push(X(i * sea.dtg)); ys.push(Math.min(Math.max(Y(sea.gaugeEta[idx]), M.top), M.top + ph));
      }
      gaugeLayer.line.setAttribute('d', path(xs, ys));
    }

    // Spectrum: input JONSWAP and the Welch estimate.
    const specEl = document.getElementById('spectrum');
    const spec = responsive(specEl, 220, (w) => {
      if (!sea) return;
      const fmax = sea.fmax, smax = sea.smax;
      const tk = ticks(fmax, 4), sk = ticks(smax, 3);
      const f = frame(specEl, w, 220, fmax, 0, smax, '$f$ (Hz)', tk.values.map((v) => [v, label(v)]), sk.values);
      const xs = [], ys = [];
      for (let i = 0; i <= 300; i++) { const fr = (i / 300) * fmax; xs.push(f.X(fr)); ys.push(f.Y(sea.S(fr))); }
      node('path', { d: `${path(xs, ys)}L${f.X(fmax)},${f.Y(0)}L${f.X(0)},${f.Y(0)}Z`, fill: '#dcefe9' }, f.root);
      node('path', { d: path(xs, ys), fill: 'none', stroke: '#216b68', 'stroke-width': 2 }, f.root);
      const ex = [], ey = [];
      sea.est.f.forEach((fr, i) => { if (fr <= fmax) { ex.push(f.X(fr)); ey.push(f.Y(Math.min(sea.est.S[i], smax))); } });
      node('path', { d: path(ex, ey), fill: 'none', stroke: '#b0723a', 'stroke-width': 1.4, 'stroke-dasharray': '4 3' }, f.root);
      node('line', { x1: f.X(sea.fp), x2: f.X(sea.fp), y1: M.top, y2: f.Y(0), stroke: '#9fb3ad', 'stroke-dasharray': '2 3' }, f.root);
      mathText(f.root, f.X(sea.fp) + 5, M.top + 10, '$f_p$', { class: 'label' });
      mathText(f.root, 4, M.top - 10, '$S$ (m²/Hz)', { class: 'label' });
    });

    // Wave heights normalised by Hm0, with the Rayleigh density p(x) = 4x exp(−2x²).
    const histEl = document.getElementById('heights');
    const hist = responsive(histEl, 220, (w) => {
      if (!sea) return;
      const bw = 0.1, nb = 22, counts = new Array(nb).fill(0);
      sea.H.forEach((Hv) => { const b = Math.floor(Hv / sea.hs / bw); if (b < nb) counts[b]++; });
      const dens = counts.map((c) => c / (sea.H.length * bw));
      const ymax = Math.max(1.3, ...dens) * 1.08;
      const f = frame(histEl, w, 220, nb * bw, 0, ymax, '$H/H_{m0}$', [0, 0.5, 1, 1.5, 2].map((v) => [v, label(v)]), ticks(ymax, 3).values);
      dens.forEach((d, i) => node('rect', { x: f.X(i * bw) + 1, y: f.Y(d), width: Math.max(1, f.X(bw) - f.X(0) - 2), height: f.Y(0) - f.Y(d), fill: '#cfe1db' }, f.root));
      const xs = [], ys = [];
      for (let i = 0; i <= 200; i++) { const x = (i / 200) * nb * bw; xs.push(f.X(x)); ys.push(f.Y(4 * x * Math.exp(-2 * x * x))); }
      node('path', { d: path(xs, ys), fill: 'none', stroke: '#216b68', 'stroke-width': 2 }, f.root);
      mathText(f.root, 4, M.top - 10, '$p$', { class: 'label' });
    });

    const clock = playback(document.getElementById('play'), t, (time) => { drawSurface(time); drawGauge(time); });
    document.getElementById('preset-flume').addEventListener('click', () => apply(presets.flume));
    document.getElementById('preset-sea').addEventListener('click', () => apply(presets.sea));
    document.getElementById('reseed').addEventListener('click', () => { seed = (seed * 48271 + 11) % 2147483647; compute(); });
    apply(presets.flume);
  </script>
</body>
</html>
